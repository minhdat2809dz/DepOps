name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  # GIAI ĐOẠN 1: Kiểm tra build thử nghiệm trên GitHub Actions
  build-and-test:
    name: 🛠️ Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Build Docker Image
        run: |
          docker build -t techstore-test:latest .

      - name: 🧪 Test chạy thử container
        run: |
          docker run -d -p 8080:80 --name test-container techstore-test:latest
          sleep 3
          curl -I http://localhost:8080 | grep "200 OK"

  # GIAI ĐOẠN 2: Triển khai trực tiếp lên máy chủ AWS EC2
  deploy-to-ec2:
    name: 🚀 Deploy lên AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 SSH vào EC2 và cập nhật ứng dụng
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "📥 Đang kéo mã nguồn mới nhất về EC2..."
            cd ~/DepOps
            git pull origin main

            echo "🔄 Dừng phiên bản cũ nếu đang chạy..."
            docker stop techstore_app || true
            docker rm techstore_app || true

            echo "🏗️ Build Docker image và khởi chạy container tại cổng 80..."
            docker build -t techstore:latest .
            docker run -d -p 80:80 --name techstore_app --restart always techstore:latest

            echo "🧹 Dọn dẹp images cũ..."
            docker image prune -f

            echo "✅ Triển khai hoàn tất!"
