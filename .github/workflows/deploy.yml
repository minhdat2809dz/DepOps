name: CI/CD Pipeline with Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==================== GIAI ĐOẠN 1: CI (Continuous Integration) ====================
  build-and-test:
    name: 🛠️ Build & Kiểm Tra Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải mã nguồn (Checkout Repository)
        uses: actions/checkout@v4

      - name: ⚙️ Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image để kiểm tra tính toàn vẹn
        run: |
          docker build -t techstore-test:latest .

      - name: 🧪 Khởi chạy container thử nghiệm
        run: |
          docker run -d -p 8080:80 --name test-container techstore-test:latest
          sleep 3

      - name: 🔍 Kiểm tra trạng thái phản hồi HTTP 200
        run: |
          curl -I http://localhost:8080 | grep "200 OK"

  # ==================== GIAI ĐOẠN 2: CD (Continuous Deployment) ====================
  push-and-deploy:
    name: 🚀 Đẩy Image lên Docker Hub & Triển khai
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Tải mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước này chỉ chạy khi bạn đã cấu hình DOCKERHUB_USERNAME và DOCKERHUB_TOKEN trong GitHub Secrets
      - name: 🔐 Đăng nhập vào Docker Hub
        if: "${{ env.DOCKERHUB_USERNAME != '' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📤 Build & Đẩy Image lên Docker Hub
        if: "${{ env.DOCKERHUB_USERNAME != '' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/techstore:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/techstore:${{ github.sha }}

