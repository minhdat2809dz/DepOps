<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập / Đăng Ký - TechStore</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background-color: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      padding: 36px 32px;
      position: relative;
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .login-logo svg {
      color: var(--primary);
    }

    .login-logo span {
      color: var(--primary);
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 24px;
    }

    .auth-tab-item {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .auth-tab-item.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .back-to-store {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color var(--transition-fast);
    }

    .back-to-store:hover {
      color: var(--primary);
    }

    /* Triệt tiêu màu nền xanh/vàng autofill của trình duyệt */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
      -webkit-text-fill-color: var(--text-main) !important;
      transition: background-color 5000s ease-in-out 0s;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <a href="index.html" class="login-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        Tech<span>Store</span>
      </a>
      <p class="login-subtitle">Cổng đăng nhập khách hàng & quản trị</p>
    </div>

    <!-- Thanh chuyển đổi Tabs -->
    <div class="auth-tabs">
      <div id="tab-nav-login" class="auth-tab-item active" onclick="showAuthTab('login')">Đăng Nhập</div>
      <div id="tab-nav-register" class="auth-tab-item" onclick="showAuthTab('register')">Đăng Ký</div>
    </div>

    <!-- ==================== TAB 1: ĐĂNG NHẬP ==================== -->
    <div id="tab-pane-login" class="tab-content active">
      <div id="login-alert-box" class="login-alert"></div>

      <form id="unified-login-form" autocomplete="off">
        <!-- Input bẫy autofill của trình duyệt -->
        <input type="text" style="display:none;" name="fake-login-acc" tabindex="-1">
        <input type="password" style="display:none;" name="fake-login-pwd" tabindex="-1">

        <div class="form-group">
          <label for="login-account">Tên đăng nhập</label>
          <input type="text" id="login-account" class="form-control" placeholder="Nhập tên đăng nhập" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required>
        </div>

        <div class="form-group">
          <label for="login-password">Mật khẩu</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" class="form-control" placeholder="Nhập mật khẩu" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required>
            <button type="button" class="password-toggle-btn" onclick="togglePass('login-password')" title="Ẩn/Hiện mật khẩu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-label">
            <input type="checkbox" id="login-remember">
            <span>Ghi nhớ đăng nhập</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Đăng Nhập Ngay
        </button>
      </form>
    </div>

    <!-- ==================== TAB 2: ĐĂNG KÝ TÀI KHOẢN MỚI ==================== -->
    <div id="tab-pane-register" class="tab-content">
      <div id="reg-alert-box" class="login-alert"></div>

      <form id="unified-reg-form" autocomplete="off">
        <!-- Input bẫy autofill của trình duyệt -->
        <input type="text" style="display:none;" name="fake-reg-acc" tabindex="-1">
        <input type="password" style="display:none;" name="fake-reg-pwd" tabindex="-1">

        <div class="form-group">
          <label for="reg-name">Họ và tên *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Nhập họ và tên" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required>
        </div>

        <div class="form-group">
          <label for="reg-email">Địa chỉ Email *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="Nhập địa chỉ email" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required>
        </div>

        <div class="form-group">
          <label for="reg-phone">Số điện thoại *</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="Nhập số điện thoại" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required>
        </div>

        <div class="form-group">
          <label for="reg-pass">Mật khẩu (từ 6 ký tự) *</label>
          <div class="password-wrapper">
            <input type="password" id="reg-pass" class="form-control" placeholder="Nhập mật khẩu" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" minlength="6" required>
            <button type="button" class="password-toggle-btn" onclick="togglePass('reg-pass')" title="Ẩn/Hiện mật khẩu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-confirm">Xác nhận lại mật khẩu *</label>
          <input type="password" id="reg-confirm" class="form-control" placeholder="Nhập lại mật khẩu" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Đăng Ký Tài Khoản
        </button>
      </form>
    </div>

    <a href="index.html" class="back-to-store">
      ← Quay lại trang Cửa Hàng
    </a>
  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/user-auth.js"></script>
  <script>
    // Hàm xóa sạch toàn bộ các ô nhập liệu
    function clearAllInputs() {
      const inputs = [
        'login-account', 'login-password', 
        'reg-name', 'reg-email', 'reg-phone', 'reg-pass', 'reg-confirm'
      ];
      inputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.value = '';
          el.setAttribute('readonly', 'readonly');
        }
      });
    }

    // Xóa sạch giá trị và ngăn chặn autofill của trình duyệt khi mở trang
    window.addEventListener('DOMContentLoaded', () => {
      clearAllInputs();
      setTimeout(clearAllInputs, 50);
      setTimeout(clearAllInputs, 200);
      setTimeout(clearAllInputs, 500);
    });

    // Kiểm tra URL params nếu có ?tab=register
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'register') {
      showAuthTab('register');
    }

    // Chuyển tab Đăng Nhập / Đăng Ký
    function showAuthTab(tab) {
      const navLogin = document.getElementById('tab-nav-login');
      const navReg = document.getElementById('tab-nav-register');
      const paneLogin = document.getElementById('tab-pane-login');
      const paneReg = document.getElementById('tab-pane-register');
      const loginAlert = document.getElementById('login-alert-box');
      const regAlert = document.getElementById('reg-alert-box');

      if (loginAlert) loginAlert.style.display = 'none';
      if (regAlert) regAlert.style.display = 'none';

      if (tab === 'login') {
        navLogin.classList.add('active');
        navReg.classList.remove('active');
        paneLogin.classList.add('active');
        paneReg.classList.remove('active');
      } else {
        navLogin.classList.remove('active');
        navReg.classList.add('active');
        paneLogin.classList.remove('active');
        paneReg.classList.add('active');
      }

      // Luôn dọn sạch dữ liệu khi chuyển qua lại giữa các tab
      clearAllInputs();
    }

    // Toggle ẩn / hiện password
    function togglePass(inputId) {
      const el = document.getElementById(inputId);
      if (el) {
        el.type = el.type === 'password' ? 'text' : 'password';
      }
    }

    // Xử lý gửi Form ĐĂNG NHẬP
    const loginForm = document.getElementById('unified-login-form');
    const loginAlert = document.getElementById('login-alert-box');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const account = document.getElementById('login-account').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const remember = document.getElementById('login-remember').checked;

      // 1. Kiểm tra tài khoản Admin
      if (account.toLowerCase() === 'admin' && (password === '123' || password === 'admin123')) {
        loginAdmin('admin', password, remember);
        loginAlert.className = 'login-alert';
        loginAlert.style.backgroundColor = '#ecfdf5';
        loginAlert.style.borderLeftColor = 'var(--success)';
        loginAlert.style.color = 'var(--success)';
        loginAlert.textContent = 'Đăng nhập Quản Trị thành công! Đang chuyển hướng...';
        loginAlert.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 600);
        return;
      }

      // 2. Kiểm tra tài khoản Khách hàng
      const userRes = loginUser(account, password, remember);
      if (userRes.success) {
        loginAlert.className = 'login-alert';
        loginAlert.style.backgroundColor = '#ecfdf5';
        loginAlert.style.borderLeftColor = 'var(--success)';
        loginAlert.style.color = 'var(--success)';
        loginAlert.textContent = userRes.message + ' Đang chuyển về cửa hàng...';
        loginAlert.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } else {
        loginAlert.className = 'login-alert';
        loginAlert.style.backgroundColor = '#fef2f2';
        loginAlert.style.borderLeftColor = 'var(--danger)';
        loginAlert.style.color = 'var(--danger)';
        loginAlert.textContent = userRes.message;
        loginAlert.style.display = 'block';
      }
    });

    // Xử lý gửi Form ĐĂNG KÝ
    const regForm = document.getElementById('unified-reg-form');
    const regAlert = document.getElementById('reg-alert-box');

    regForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const pass = document.getElementById('reg-pass').value.trim();
      const confirm = document.getElementById('reg-confirm').value.trim();

      if (pass !== confirm) {
        regAlert.textContent = 'Mật khẩu xác nhận không trùng khớp!';
        regAlert.style.display = 'block';
        return;
      }

      const res = registerUser(name, email, phone, pass);
      if (res.success) {
        regAlert.className = 'login-alert';
        regAlert.style.backgroundColor = '#ecfdf5';
        regAlert.style.borderLeftColor = 'var(--success)';
        regAlert.style.color = 'var(--success)';
        regAlert.textContent = 'Tạo tài khoản thành công! Đang chuyển về cửa hàng...';
        regAlert.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } else {
        regAlert.className = 'login-alert';
        regAlert.style.backgroundColor = '#fef2f2';
        regAlert.style.borderLeftColor = 'var(--danger)';
        regAlert.style.color = 'var(--danger)';
        regAlert.textContent = res.message;
        regAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
