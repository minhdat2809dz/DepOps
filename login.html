<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập / Đăng Ký - TechStore VIP PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #07090e 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Vòng tròn ánh sáng nền */
    .ambient-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, rgba(124, 58, 237, 0) 70%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-xl);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 30px rgba(59, 130, 246, 0.15);
      padding: 40px 36px;
      position: relative;
      z-index: 1;
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .login-logo svg {
      color: var(--primary);
      filter: drop-shadow(0 0 10px var(--primary-glow));
    }

    .login-logo span {
      color: var(--primary);
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 24px;
    }

    .auth-tab-item {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .auth-tab-item.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      color: var(--text-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle-btn:hover {
      color: var(--text-main);
    }

    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.88rem;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .quick-demo-fill {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
    }

    .quick-demo-fill:hover {
      text-decoration: underline;
    }

    .back-to-store {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      text-align: center;
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color var(--transition-fast);
    }

    .back-to-store:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="login-container">
    <div class="login-header">
      <a href="index.html" class="login-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        Tech<span>Store</span>
        <span class="vip-logo-badge">VIP PRO</span>
      </a>
      <p class="login-subtitle">Cổng đăng nhập Thành Viên VIP & Quản Trị Hệ Thống</p>
    </div>

    <!-- Thanh chuyển đổi Tabs -->
    <div class="auth-tabs">
      <div id="tab-nav-login" class="auth-tab-item active" onclick="showAuthTab('login')">Đăng Nhập VIP</div>
      <div id="tab-nav-register" class="auth-tab-item" onclick="showAuthTab('register')">Đăng Ký Mới</div>
    </div>

    <!-- ==================== TAB 1: ĐĂNG NHẬP ==================== -->
    <div id="tab-pane-login" class="tab-content active">
      <div id="login-alert-box" class="login-alert"></div>

      <form id="unified-login-form" autocomplete="off">
        <div class="form-group">
          <label for="login-account">Tên đăng nhập (Email / SĐT / admin) *</label>
          <input type="text" id="login-account" class="form-control" placeholder="Nhập email, số điện thoại hoặc 'admin'" required>
        </div>

        <div class="form-group">
          <label for="login-password">Mật khẩu *</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" class="form-control" placeholder="Nhập mật khẩu" required>
            <button type="button" class="password-toggle-btn" onclick="togglePass('login-password')" title="Ẩn/Hiện mật khẩu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-label">
            <input type="checkbox" id="login-remember" checked>
            <span>Ghi nhớ phiên</span>
          </label>
          <span class="quick-demo-fill" onclick="fillAdminDemo()">Admin mẫu</span>
          <span class="quick-demo-fill" onclick="fillUserDemo()">Khách VIP mẫu</span>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Đăng Nhập Ngay
        </button>
      </form>
    </div>

    <!-- ==================== TAB 2: ĐĂNG KÝ ==================== -->
    <div id="tab-pane-register" class="tab-content">
      <div id="reg-alert-box" class="login-alert"></div>

      <form id="unified-reg-form" autocomplete="off">
        <div class="form-group">
          <label for="reg-name">Họ và tên *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Ví dụ: Hoàng Minh Tuấn" required>
        </div>

        <div class="form-group">
          <label for="reg-email">Địa chỉ Email *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="vidu@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="reg-phone">Số điện thoại *</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="0912345678" required>
        </div>

        <div class="form-group">
          <label for="reg-pass">Mật khẩu (tối thiểu 6 ký tự) *</label>
          <div class="password-wrapper">
            <input type="password" id="reg-pass" class="form-control" placeholder="Nhập mật khẩu" minlength="6" required>
            <button type="button" class="password-toggle-btn" onclick="togglePass('reg-pass')" title="Ẩn/Hiện mật khẩu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-confirm">Xác nhận lại mật khẩu *</label>
          <input type="password" id="reg-confirm" class="form-control" placeholder="Nhập lại mật khẩu" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Tạo Tài Khoản & Nhận Điểm VIP
        </button>
      </form>
    </div>

    <a href="index.html" class="back-to-store">
      ← Quay lại Cửa Hàng TechStore VIP PRO
    </a>
  </div>

  <!-- Scripts -->
  <script src="js/api-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/user-auth.js"></script>
  <script>
    // Kiểm tra URL params nếu có ?tab=register
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'register') {
      showAuthTab('register');
    }

    function showAuthTab(tab) {
      const navLogin = document.getElementById('tab-nav-login');
      const navReg = document.getElementById('tab-nav-register');
      const paneLogin = document.getElementById('tab-pane-login');
      const paneReg = document.getElementById('tab-pane-register');
      const loginAlert = document.getElementById('login-alert-box');
      const regAlert = document.getElementById('reg-alert-box');

      if (loginAlert) loginAlert.style.display = 'none';
      if (regAlert) regAlert.style.display = 'none';

      if (tab === 'login') {
        navLogin.classList.add('active');
        navReg.classList.remove('active');
        paneLogin.classList.add('active');
        paneReg.classList.remove('active');
      } else {
        navLogin.classList.remove('active');
        navReg.classList.add('active');
        paneLogin.classList.remove('active');
        paneReg.classList.add('active');
      }
    }

    function togglePass(inputId) {
      const el = document.getElementById(inputId);
      if (el) {
        el.type = el.type === 'password' ? 'text' : 'password';
      }
    }

    function fillAdminDemo() {
      document.getElementById('login-account').value = 'admin';
      document.getElementById('login-password').value = '123';
    }

    function fillUserDemo() {
      document.getElementById('login-account').value = 'khachhang@gmail.com';
      document.getElementById('login-password').value = '123456';
    }

    // Xử lý gửi Form ĐĂNG NHẬP
    const loginForm = document.getElementById('unified-login-form');
    const loginAlert = document.getElementById('login-alert-box');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const account = document.getElementById('login-account').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const remember = document.getElementById('login-remember').checked;

      // 1. Kiểm tra tài khoản Admin
      if (account.toLowerCase() === 'admin' && (password === '123' || password === 'admin123')) {
        loginAdmin('admin', password, remember);
        loginAlert.className = 'login-alert';
        loginAlert.style.backgroundColor = 'rgba(16, 185, 129, 0.2)';
        loginAlert.style.color = '#34d399';
        loginAlert.textContent = 'Đăng nhập Quản Trị thành công! Đang chuyển hướng...';
        loginAlert.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 500);
        return;
      }

      // 2. Kiểm tra tài khoản Khách hàng
      const userRes = loginUser(account, password, remember);
      if (userRes.success) {
        loginAlert.className = 'login-alert';
        loginAlert.style.backgroundColor = 'rgba(16, 185, 129, 0.2)';
        loginAlert.style.color = '#34d399';
        loginAlert.textContent = userRes.message + ' Đang chuyển về cửa hàng...';
        loginAlert.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } else {
        loginAlert.className = 'login-alert';
        loginAlert.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
        loginAlert.style.color = '#f87171';
        loginAlert.textContent = userRes.message;
        loginAlert.style.display = 'block';
      }
    });

    // Xử lý gửi Form ĐĂNG KÝ
    const regForm = document.getElementById('unified-reg-form');
    const regAlert = document.getElementById('reg-alert-box');

    regForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const pass = document.getElementById('reg-pass').value.trim();
      const confirm = document.getElementById('reg-confirm').value.trim();

      if (pass !== confirm) {
        regAlert.textContent = 'Mật khẩu xác nhận không trùng khớp!';
        regAlert.style.display = 'block';
        return;
      }

      const res = registerUser(name, email, phone, pass);
      if (res.success) {
        regAlert.className = 'login-alert';
        regAlert.style.backgroundColor = 'rgba(16, 185, 129, 0.2)';
        regAlert.style.color = '#34d399';
        regAlert.textContent = 'Tạo tài khoản thành công! Đang chuyển về cửa hàng...';
        regAlert.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 700);
      } else {
        regAlert.className = 'login-alert';
        regAlert.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
        regAlert.style.color = '#f87171';
        regAlert.textContent = res.message;
        regAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
